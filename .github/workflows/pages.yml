# Publishes the game to GitHub Pages on every push to master.
# The site is the folder as it is; nothing is built here (build/build.py is for local use).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir _site
          rsync -a --exclude '.git*' --exclude '.github' --exclude '_site' \
            --exclude 'build' --exclude 'docs' \
            --exclude '*.md' --exclude 'netlify.toml' --exclude '_headers' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
